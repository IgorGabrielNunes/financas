# Worker que dispara os avisos do Vida (WhatsApp/Telegram) a cada 5 minutos.
# Lê o Neon direto: não acorda a API no Render (não gasta as horas grátis de lá).
name = "vida-avisos"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# Segredos (nunca no arquivo): rode uma vez, de dentro desta pasta:
#   npx wrangler secret put DATABASE_URL         (a mesma connection string do Neon da API)
#   npx wrangler secret put TELEGRAM_BOT_TOKEN   (opcional: só se usar Telegram)
